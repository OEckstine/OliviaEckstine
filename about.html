  <script>
    const text = "A Design & Technology Student At Parsons School Of Design Exploring How Creativity, Data, And Storytelling Intersect.";
    const target = document.getElementById("typed");
    const speed = 45; 
    let i = 0;
    function type() {
      if (i < text.length) {
        target.textContent += text.charAt(i);
        i++;
        setTimeout(type, speed);
      }
    }
    type();
  </script>
